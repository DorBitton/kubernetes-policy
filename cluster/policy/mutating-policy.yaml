# Using the classic ClusterPolicy engine (deprecated, removal targeted for
# Kyverno v1.20 ~Oct 2026) instead of the newer CEL-based MutatingPolicy.
# MutatingPolicy was tried first and both its patchType options failed on
# this exact mutation(an identical raw `kubectl patch` succeeds):
#   - ApplyConfiguration: "may not mutate atomic arrays, maps or structs"
#     the moment a LabelSelector-typed field is set on a new list element.
#   - JSONPatch: CEL type-checker fails to compile a map literal mixing
#     int (maxSkew) with string/map values, even wrapped in dyn().
# Revisit once Kyverno fixes this and migrate back to MutatingPolicy.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zone-balance
spec:
  rules:
    # Stamps zone-policy.io/managed-spread: "true" on every successful
    # mutation. mutating webhooks run before validating webhooks in the 
    # same admission request. This way we can distinguish between mutated
    # deployments and non mutated.
    - name: inject-topology-spread
      match:
        any:
          - resources:
              kinds:
                - Deployment
      # System/infra namespaces excluded: this policy is for application
      # workloads, not cluster components. Not the ideal way, prone to error
      # if not added all correct namespaces
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - kyverno
                - local-path-storage
      preconditions:
        all:
          - key: "{{ request.object.spec.template.spec.topologySpreadConstraints || '' }}"
            operator: Equals
            value: ''
          - key: "{{ request.object.spec.template.spec.nodeSelector || '' }}"
            operator: Equals
            value: ''
          - key: "{{ request.object.spec.template.spec.affinity || '' }}"
            operator: Equals
            value: ''
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              zone-policy.io/managed-spread: "true"
          spec:
            template:
              spec:
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: topology.kubernetes.io/zone
                    whenUnsatisfiable: ScheduleAnyway
                    labelSelector:
                      matchLabels: "{{ request.object.spec.selector.matchLabels }}"
                    matchLabelKeys:
                      - pod-template-hash
                  # Zone spread alone allows multiple replicas to land on the
                  # same node within a zone.
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
                    labelSelector:
                      matchLabels: "{{ request.object.spec.selector.matchLabels }}"
                    matchLabelKeys:
                      - pod-template-hash

    # Enforce minimum replicas for HA (chosen 3 due to my 3 zones)
    - name: enforce-minimum-replicas
      match:
        any:
          - resources:
              kinds:
                - Deployment
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - kyverno
                - local-path-storage
      preconditions:
        all:
          - key: "{{ request.object.spec.replicas }}"
            operator: LessThan
            value: 3
      mutate:
        patchStrategicMerge:
          spec:
            replicas: 3
